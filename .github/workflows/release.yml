name: Release

# A `v*` tag builds the unsigned desktop installers on Windows, macOS and Linux and attaches
# them to a draft GitHub Release. workflow_dispatch builds the same installers as workflow
# artifacts only, for testing. No signing, updater or web-client publishing yet
# (docs/design.md, "Repository and delivery").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installers:
    name: installers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native capture (GStreamer): bundled on Windows (a trimmed, LGPL-only copy,
        # task app:gst:stage), the distro's packages on Linux (the .deb depends on
        # them; 24.04 for GStreamer 1.24). macOS stays on the webview microphone.
        include:
          - name: windows
            os: windows-latest
            bundles: nsis,msi
            features: desktop,native-capture
            extra_config: --config tauri.gst.conf.json
          - name: macos
            os: macos-latest
            bundles: app,dmg
            features: desktop
            extra_config: ""
          - name: linux
            os: ubuntu-24.04
            bundles: deb,appimage
            features: desktop,native-capture
            extra_config: --config tauri.gst-deb.conf.json
    env:
      GST_VERSION: 1.28.8
      GST_SHA256: e4c41ee6ee9c6c32a45d198463ec08d79bac3bd5fa58adc93d13fe4a08abc9d9
      # AppImage tooling runs without FUSE on the runner.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain and wasm32 target
        run: rustup show active-toolchain

      # The Tauri 2 Linux prerequisites, plus a virtual display for the smoke run.
      - name: Install webview and tray libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-pulseaudio
          pkg-config --modversion gstreamer-1.0

      - name: Cache the GStreamer installer
        if: matrix.name == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gstreamer-installer
          key: gstreamer-msvc-x86_64-${{ env.GST_VERSION }}

      # The official MSVC runtime and development files (one Inno Setup installer):
      # the build links against it and task app:gst:stage copies the trimmed set.
      - name: Install GStreamer (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'gstreamer-installer'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = Join-Path $dir "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe"
          if (-not (Test-Path $exe)) {
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest -UseBasicParsing -OutFile $exe -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe"
          }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:GST_SHA256) { throw 'GStreamer installer checksum mismatch' }
          Start-Process -Wait $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/TYPE=full', '/DIR=C:\gstreamer'
          $pc = Get-ChildItem C:\gstreamer -Recurse -Filter gstreamer-1.0.pc | Select-Object -First 1
          if (-not $pc) { Get-ChildItem C:\gstreamer -Depth 3 | Select-Object -First 30 FullName; throw 'no GStreamer development files' }
          $root = $pc.Directory.Parent.Parent.FullName
          Write-Host "GStreamer at $root"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH

      - name: Install uv
        if: matrix.name == 'windows'
        uses: astral-sh/setup-uv@v10.3.3

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder
          key: installers-${{ matrix.name }}

      # Prebuilt binaries: trunk downloads the pinned wasm-bindgen itself (Trunk.toml).
      - name: Install trunk and cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: trunk,cargo-binstall

      - name: Install tauri-cli
        run: cargo binstall tauri-cli --version "^2" --no-confirm --locked

      - name: Stage the bundled GStreamer (Windows)
        if: matrix.name == 'windows'
        run: task app:gst:stage

      # The client is built with trunk and bundled as the app's `client` resource.
      - name: Build installers
        run: task app:bundle FEATURES=${{ matrix.features }} EXTRA_CONFIG="${{ matrix.extra_config }}" -- --bundles ${{ matrix.bundles }}

      - name: Installer sizes
        shell: bash
        run: find castcorder/target/release/bundle -maxdepth 2 -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec ls -l {} \;

      # Without the build's GStreamer on PATH or in the environment, so only the
      # installed copy can satisfy the app.
      - name: Smoke test the installed app (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'castcorder-install'
          $setup = Get-ChildItem castcorder/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -Wait $setup.FullName -ArgumentList '/S', "/D=$dir"
          if (-not (Test-Path "$dir/client/index.html")) { throw 'client not installed' }
          if (-not (Test-Path "$dir/gstreamer-1.0-0.dll")) { throw 'GStreamer not installed' }
          if (-not (Test-Path "$dir/licenses/gstreamer/NOTICE.txt")) { throw 'GStreamer notice not installed' }
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch 'gstreamer' }) -join ';'
          Get-ChildItem env: | Where-Object { $_.Name -match '^GST' } | ForEach-Object { Remove-Item "env:$($_.Name)" }
          $gst = & "$dir/castcorder-app.exe" --smoke-gst 2>&1 | Out-String
          Write-Host $gst
          if ($gst -notmatch 'GST_OK') { throw 'GStreamer did not initialise with every element' }
          $outside = $gst -split "`n" | Where-Object { $_ -match '^GST_ELEMENT \S+ (.+)$' -and -not $Matches[1].Trim().StartsWith($dir, [StringComparison]::OrdinalIgnoreCase) }
          if ($outside) { throw "plugins loaded from outside the install: $outside" }
          $out = & "$dir/castcorder-app.exe" --smoke 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'APP_READY') { throw 'smoke run did not reach APP_READY' }

      - name: Smoke test the installed app (Linux)
        if: matrix.name == 'linux'
        # WebKitGTK under xvfb: no DMA-BUF renderer.
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          deb=$(ls castcorder/target/release/bundle/deb/*.deb)
          pkg=$(dpkg-deb -f "$deb" Package)
          dpkg-deb -f "$deb" Depends
          dpkg-deb -f "$deb" Depends | grep -q 'libgstreamer1.0-0 (>= 1.24)'
          dpkg-deb -f "$deb" Depends | grep -q 'gstreamer1.0-pulseaudio'
          sudo apt-get install -y "./$deb"
          dpkg -L "$pkg" | grep -E 'bin/|client/index.html'
          dpkg -L "$pkg" | grep -q 'client/index.html'
          castcorder-app --smoke-gst 2>&1 | tee smoke-gst.log
          grep -q GST_OK smoke-gst.log
          xvfb-run -a castcorder-app --smoke 2>&1 | tee smoke.log
          grep -q APP_READY smoke.log

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            castcorder/target/release/bundle/nsis/*.exe
            castcorder/target/release/bundle/msi/*.msi
            castcorder/target/release/bundle/dmg/*.dmg
            castcorder/target/release/bundle/deb/*.deb
            castcorder/target/release/bundle/appimage/*.AppImage

  # Only a version tag publishes: a draft release the maintainer reviews and publishes.
  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l installers
          gh release create "$GITHUB_REF_NAME" installers/* --draft --generate-notes --title "$GITHUB_REF_NAME"
