name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels the older run. A push to main never does.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Tests that would skip themselves (no audio device, no LAN address) fail instead.
env:
  CASTCORDER_CI: 1

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the protocol check compares with the last release tag.
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Python tooling always goes through uv, never pip.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      # For the tofu-fmt hook and the deploy/tofu validation below.
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pre-commit hooks on every file
        run: uvx --with pre-commit-uv pre-commit run --all-files --show-diff-on-failure

      # No secrets and no Cloudflare or GitHub calls: fmt, provider download, validate.
      - name: Validate deploy/tofu
        run: task deploy:infra:validate

      # docs/release.md: every copy of the workspace version agrees, CHANGELOG.md is well
      # formed, and the wire encodings of the last release are unchanged.
      - name: Release consistency
        run: task release:check

      - name: Protocol compatibility with the last release
        run: task release:protocol

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # rust-toolchain.toml pins the version, components, and wasm32 target; rustup installs
      # them on first use.
      - name: Ensure toolchain and wasm32 target
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          # castcorder/worker is its own workspace (the Cloudflare Worker, wasm32).
          workspaces: |
            castcorder
            castcorder/worker

      - name: Format and clippy
        run: task lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain and wasm32 target
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder

      # The whisper.cpp contract (castcorder-transcribe) needs a model: CI uses the
      # base English model (the CPU one installers will ship, cast-7hm.4), cached.
      - name: Cache whisper model
        id: whisper-model
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/whisper-models
          key: whisper-ggml-base.en-v1

      - name: Fetch whisper model
        if: steps.whisper-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/whisper-models
          curl -fsSL --retry 4 -o ${{ runner.temp }}/whisper-models/ggml-base.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin

      # The models installers bundle (scripts/fetch_models.py), so the test of
      # picking between them runs on the real pair: on this GPU-less runner the
      # GPU model is too slow and the CPU model must be kept.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Cache bundled models
        id: bundled-models
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bundled-models
          key: bundled-models-${{ hashFiles('scripts/fetch_models.py') }}

      - name: Fetch bundled models
        if: steps.bundled-models.outputs.cache-hit != 'true'
        run: uv run scripts/fetch_models.py ${{ runner.temp }}/bundled-models

      # Tiers 1-2 (unit, simulation). The system and browser tiers join here with M1.
      - name: Unit and simulation tests
        run: task check
        env:
          CASTCORDER_WHISPER_MODEL: ${{ runner.temp }}/whisper-models/ggml-base.en.bin
          CASTCORDER_REQUIRE_WHISPER: "1"
          CASTCORDER_MODELS: ${{ runner.temp }}/bundled-models
          CASTCORDER_EXPECT_GPU: "0"

      # The installers' Vulkan build of whisper.cpp on a runner with no GPU: it
      # must fall back to the CPU, not abort (cast-7hm.4). CPU only by design.
      - name: Whisper contract, Vulkan build without a GPU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslc
          cargo test -p castcorder-transcribe --features vulkan --locked --test contract
        working-directory: castcorder
        env:
          CASTCORDER_WHISPER_MODEL: ${{ runner.temp }}/whisper-models/ggml-base.en.bin
          CASTCORDER_REQUIRE_WHISPER: "1"
          CASTCORDER_MODELS: ${{ runner.temp }}/bundled-models
          CASTCORDER_EXPECT_GPU: "0"

  # The desktop app's Tauri shell (castcorder-app --features desktop): clippy, its
  # tests, and a smoke run under a virtual display. Kept out of `task check`
  # because it needs the system webview.
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain and wasm32 target
        run: rustup show active-toolchain

      # The Tauri 2 Linux prerequisites, plus a virtual display for the smoke run.
      - name: Install webview and tray libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder
          key: app

      - name: Clippy, tests and smoke run
        # WebKitGTK under xvfb: no DMA-BUF renderer.
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run -a task app:check

  # The native-capture feature (GStreamer): castcorder-capture-gst, and the host and app
  # built with it, which no other job compiles.
  gst:
    name: gst
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain
        run: rustup show active-toolchain

      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev             libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base             gstreamer1.0-plugins-good gstreamer1.0-pulseaudio
          pkg-config --modversion gstreamer-1.0

      # The real-microphone tests skip themselves without an input device; a pulseaudio
      # null sink's monitor gives them one (the default source), as on a fresh desktop.
      - name: Start a null audio sink
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci
          pactl set-default-source ci.monitor
          pactl info

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder
          key: gst

      - name: Clippy and tests with native capture
        run: task test:gst

  # Tier 4: Playwright against headless Chromium and Firefox. No Docker: the host, the
  # transport example and the client build all run as plain processes on the runner.
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain and wasm32 target
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder

      # Prebuilt binary; trunk downloads the pinned wasm-bindgen itself (Trunk.toml).
      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Playwright itself and the browsers are installed by the tasks (setup.mjs); only
      # the OS libraries need root, so they are installed here.
      - name: Install browser system libraries
        working-directory: castcorder/crates/castcorder-client/browser-test
        run: |
          npm install --no-audit --no-fund
          npx playwright install-deps chromium firefox

      # Headless runners have no sound server; without a sink Firefox's AudioContext stays
      # suspended and the capture worklet never starts. A null sink stands in for a speaker.
      - name: Start a null audio sink
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci
          pactl info

      # ffprobe checks the recorded webcam tracks (WebM) in the video recording test.
      - name: Install ffprobe
        run: sudo apt-get install -y --no-install-recommends ffmpeg && ffprobe -version | head -1

      - name: Browser tests
        run: |
          ip -4 addr show
          task test:browser

  # Tier 3, forced relay: coturn in Docker (the runner's Docker Engine), the real host
  # and rendezvous as processes, two relay-only headless Chromium guests; spans a TURN
  # credential renewal (relay.mjs). Then the local dev stack (docker-compose.yml) is
  # validated and brought up for real: the rendezvous image builds and serves, and
  # both STUN ports answer.
  relay:
    name: relay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain and wasm32 target
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            castcorder
            castcorder/worker

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser system libraries
        working-directory: castcorder/crates/castcorder-client/browser-test
        run: |
          npm install --no-audit --no-fund
          npx playwright install-deps chromium

      - name: Start a null audio sink
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci

      - name: Pull coturn
        run: docker pull coturn/coturn:4.6

      - name: Relay test (spans a credential renewal)
        run: task test:relay

      # The same forced-relay call with coturn reachable over TCP only: the host's
      # TURN client goes through its stream bridge (cast-bpl, cast-76o).
      - name: Relay test over TCP
        run: task test:relay:tcp

      # Tier 3 system test: guest joins by call link only through the rendezvous. Shares
      # the host, rendezvous and client builds (and the null sink) set up for the relay test.
      - name: System test (call link through the rendezvous)
        run: task test:system

      # The same system test against the Cloudflare Worker under `wrangler dev`
      # (ADR 0004): local only, no account. Builds worker-build and wrangler inside
      # castcorder/worker first. Also runs the Worker's relay path (RELAY=coturn)
      # with a relay-only host and a forced-relay guest through coturn.
      - name: System test against the Worker (wrangler dev)
        run: task test:system:worker

      # The Worker's relay credentials and its per-host-key daily cap across a
      # wrangler restart. Its Cloudflare Realtime TURN part runs only with a TURN
      # key and is the one part allowed to skip under CASTCORDER_CI: it runs when
      # CF_TURN_* are also repository secrets (deploy/README.md, step 6).
      - name: Worker relay credentials and daily cap (wrangler dev)
        run: task test:worker:relay
        env:
          # Empty (so that part skips) unless these are repository secrets.
          CF_TURN_KEY_ID: ${{ secrets.CF_TURN_KEY_ID }}
          CF_TURN_API_TOKEN: ${{ secrets.CF_TURN_API_TOKEN }}

      - name: Upload system logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: system-logs
          path: |
            castcorder/crates/castcorder-client/browser-test/test-results/system-*
            castcorder/crates/castcorder-client/browser-test/test-results/worker-relay-*

      - name: Upload relay logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relay-logs
          path: castcorder/crates/castcorder-client/browser-test/test-results/relay-*

      # The client build test:relay left in dist/ is what the compose file mounts.
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Bring up the dev stack
        run: |
          docker compose up -d --build --wait --wait-timeout 600 || { docker compose logs; exit 1; }
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          version=$(cargo metadata --no-deps --format-version 1 --manifest-path castcorder/Cargo.toml \
            | jq -r '.packages[] | select(.name == "castcorder-client") | .version')
          curl -fsS -o /dev/null -w 'client index %{http_code}\n' "http://localhost:8080/v/$version/"
          node castcorder/crates/castcorder-client/browser-test/stun-probe.mjs 127.0.0.1:3479 127.0.0.1:3478

      - name: Stack logs
        if: always()
        run: docker compose logs --no-color || true

      - name: Tear down the dev stack
        if: always()
        run: docker compose down --volumes || true
