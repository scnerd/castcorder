name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels the older run. A push to main never does.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Python tooling always goes through uv, never pip.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run pre-commit hooks on every file
        run: uvx --with pre-commit-uv pre-commit run --all-files --show-diff-on-failure

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # rust-toolchain.toml pins the version, components, and wasm32 target; rustup installs
      # them on first use.
      - name: Ensure toolchain and wasm32 target
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder

      - name: Format and clippy
        run: task lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain and wasm32 target
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder

      # Tiers 1-2 (unit, simulation). The system and browser tiers join here with M1.
      - name: Unit and simulation tests
        run: task check

  # The desktop app's Tauri shell (castcorder-app --features desktop): clippy, its
  # tests, and a smoke run under a virtual display. Kept out of `task check`
  # because it needs the system webview.
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain and wasm32 target
        run: rustup show active-toolchain

      # The Tauri 2 Linux prerequisites, plus a virtual display for the smoke run.
      - name: Install webview and tray libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder
          key: app

      - name: Clippy, tests and smoke run
        # WebKitGTK under xvfb: no DMA-BUF renderer.
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run -a task app:check

  # The native-capture feature (GStreamer): castcorder-capture-gst, and the host and app
  # built with it, which no other job compiles.
  gst:
    name: gst
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain
        run: rustup show active-toolchain

      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev             libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base             gstreamer1.0-plugins-good gstreamer1.0-pulseaudio
          pkg-config --modversion gstreamer-1.0

      # The real-microphone tests skip themselves without an input device; a pulseaudio
      # null sink's monitor gives them one (the default source), as on a fresh desktop.
      - name: Start a null audio sink
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci
          pactl set-default-source ci.monitor
          pactl info

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder
          key: gst

      - name: Clippy and tests with native capture
        env:
          CASTCORDER_TIMING_DEBUG: "1"
        run: task test:gst

  # Tier 4: Playwright against headless Chromium and Firefox. No Docker: the host, the
  # transport example and the client build all run as plain processes on the runner.
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain and wasm32 target
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder

      # Prebuilt binary; trunk downloads the pinned wasm-bindgen itself (Trunk.toml).
      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Playwright itself and the browsers are installed by the tasks (setup.mjs); only
      # the OS libraries need root, so they are installed here.
      - name: Install browser system libraries
        working-directory: castcorder/crates/castcorder-client/browser-test
        run: |
          npm install --no-audit --no-fund
          npx playwright install-deps chromium firefox

      # Headless runners have no sound server; without a sink Firefox's AudioContext stays
      # suspended and the capture worklet never starts. A null sink stands in for a speaker.
      - name: Start a null audio sink
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci
          pactl info

      # ffprobe checks the recorded webcam tracks (WebM) in the video recording test.
      - name: Install ffprobe
        run: sudo apt-get install -y --no-install-recommends ffmpeg && ffprobe -version | head -1

      - name: Browser tests
        run: |
          ip -4 addr show
          task test:browser

  # Tier 3, forced relay: coturn in Docker (the runner's Docker Engine), the real host
  # and rendezvous as processes, two relay-only headless Chromium guests; spans a TURN
  # credential renewal (relay.mjs). Then the local dev stack (docker-compose.yml) is
  # validated and brought up for real: the rendezvous image builds and serves, and
  # both STUN ports answer.
  relay:
    name: relay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain and wasm32 target
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser system libraries
        working-directory: castcorder/crates/castcorder-client/browser-test
        run: |
          npm install --no-audit --no-fund
          npx playwright install-deps chromium

      - name: Start a null audio sink
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci

      - name: Pull coturn
        run: docker pull coturn/coturn:4.6

      - name: Relay test (spans a credential renewal)
        run: task test:relay

      - name: Upload relay logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relay-logs
          path: castcorder/crates/castcorder-client/browser-test/test-results/relay-*

      # The client build test:relay left in dist/ is what the compose file mounts.
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Bring up the dev stack
        run: |
          docker compose up -d --build --wait --wait-timeout 600 || { docker compose logs; exit 1; }
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS -o /dev/null -w 'client index %{http_code}\n' http://localhost:8080/v/0.0.0/
          node castcorder/crates/castcorder-client/browser-test/stun-probe.mjs 127.0.0.1:3479 127.0.0.1:3478

      - name: Stack logs
        if: always()
        run: docker compose logs --no-color || true

      - name: Tear down the dev stack
        if: always()
        run: docker compose down --volumes || true
