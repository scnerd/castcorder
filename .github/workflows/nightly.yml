name: Nightly

# Heavy and cross-platform tests that are too slow or too wide for every pull request
# (cast-1t7). A failing scheduled run opens a GitHub issue (once per day it fails).
# Changes to this file run it on their pull request, so it is tested where it changes.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/nightly.yml"

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CASTCORDER_CI: 1

jobs:
  # The #[ignore]d long runs: 200 MB transfer with cuts, crashes and bit flips, and the
  # two-hour takes (2 GB and 4 GB WAVs) for the aligner and the FLAC converter, in release.
  heavy:
    name: heavy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Ensure toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder
          key: nightly-heavy

      - name: Transfer, 200 MB
        working-directory: castcorder
        run: cargo test --release --locked -p castcorder-transfer -- --ignored --nocapture

      - name: Aligner, two-hour take
        working-directory: castcorder
        run: cargo test --release --locked -p castcorder-align --test long -- --ignored --nocapture

      - name: FLAC conversion, two-hour take
        working-directory: castcorder
        run: cargo test --release --locked -p castcorder-recorder --test streaming -- --ignored --nocapture

  # Camera toggles and a storage-worker stall against a recording guest (not in CI's browser job).
  camtoggle:
    name: camtoggle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain and wasm32 target
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder
          key: nightly-camtoggle

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser system libraries
        working-directory: castcorder/crates/castcorder-client/browser-test
        run: |
          npm install --no-audit --no-fund
          npx playwright install-deps chromium

      - name: Start a null audio sink
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci

      - name: Camera toggle stress
        run: task test:browser:camtoggle

  # The workspace's formatting, clippy and tests on the other desktop platforms.
  platforms:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain and wasm32 target
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder
          key: nightly-${{ matrix.os }}

      - name: Check (format, clippy, tests)
        run: task check

  # Native capture (GStreamer) on Windows (cast-51t): the official MSVC installer, as
  # release.yml installs it, then task test:gst. A hosted Windows runner has no audio
  # input device and no null-sink equivalent, so the live-microphone contract tests skip
  # here (CASTCORDER_CI is unset for that step: it turns their skip into a failure); the
  # Linux gst job in ci.yml runs them against a pulseaudio null sink. The file-source,
  # live-branch and encoder tests run.
  windows-gst:
    name: windows gst
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Keep in step with release.yml.
      GST_VERSION: 1.28.8
      GST_SHA256: e4c41ee6ee9c6c32a45d198463ec08d79bac3bd5fa58adc93d13fe4a08abc9d9
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder
          key: nightly-windows-gst

      - name: Cache the GStreamer installer
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gstreamer-installer
          key: gstreamer-msvc-x86_64-${{ env.GST_VERSION }}

      - name: Install GStreamer
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'gstreamer-installer'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = Join-Path $dir "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe"
          if (-not (Test-Path $exe)) {
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest -UseBasicParsing -OutFile $exe -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe"
          }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:GST_SHA256) { throw 'GStreamer installer checksum mismatch' }
          Start-Process -Wait $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/TYPE=full', '/DIR=C:\gstreamer'
          $pc = Get-ChildItem C:\gstreamer -Recurse -Filter gstreamer-1.0.pc | Select-Object -First 1
          if (-not $pc) { Get-ChildItem C:\gstreamer -Depth 3 | Select-Object -First 30 FullName; throw 'no GStreamer development files' }
          $root = $pc.Directory.Parent.Parent.FullName
          Write-Host "GStreamer at $root"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH

      - name: Clippy and tests with native capture
        shell: pwsh
        run: |
          Remove-Item Env:CASTCORDER_CI
          task test:gst

  # Tier 3 relay run on a degraded network: Linux tc netem on the loopback adds latency,
  # jitter and loss under the forced-relay test (coturn in Docker, two relay-only guests).
  degraded:
    name: degraded network
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure toolchain and wasm32 target
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: castcorder
          key: nightly-degraded

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser system libraries
        working-directory: castcorder/crates/castcorder-client/browser-test
        run: |
          npm install --no-audit --no-fund
          npx playwright install-deps chromium

      - name: Start a null audio sink
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci

      - name: Pull coturn
        run: docker pull coturn/coturn:4.6

      # Build first, so the slow compile does not run on a lossy loopback.
      - name: Build the host and the client
        working-directory: castcorder
        run: |
          cargo build --release --locked -p castcorder-host
          cd crates/castcorder-client && trunk build --release

      - name: Degrade the loopback (20 ms +- 5 ms, 0.5 % loss)
        run: |
          sudo tc qdisc add dev lo root netem delay 20ms 5ms loss 0.5%
          tc qdisc show dev lo

      - name: Relay test on the degraded network
        env:
          DEGRADED: "1"
        run: task test:relay

  # The release workflow, run by hand on this commit: it verifies the version, then builds the
  # installers on Windows, macOS and Linux and smoke-starts each one (no release is made). Run
  # here so a change that breaks an installer build shows up in the nightly, not at a tag
  # (cast-5gx). This job starts the run and waits for it.
  installers:
    name: release installers
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Start the release workflow
        run: |
          started=$(date -u -d '-30 seconds' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          id=""
          for _ in $(seq 1 24); do
            sleep 5
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch \
              --branch "$BRANCH" --limit 10 --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$started\")] | sort_by(.createdAt) | last | .databaseId // empty")
            [ -n "$id" ] && break
          done
          if [ -z "$id" ]; then
            echo "::error::the release workflow run did not start"
            exit 1
          fi
          echo "RELEASE_RUN=$id" >> "$GITHUB_ENV"
          echo "Release workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"

      - name: Wait for it
        run: gh run watch "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY" --interval 60 --exit-status

      # This job was cancelled (a newer run replaced it): do not leave the builds running.
      - name: Cancel the release workflow run
        if: ${{ cancelled() && env.RELEASE_RUN != '' }}
        run: gh run cancel "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY"

  # A failing scheduled run files an issue pointing at it.
  report:
    name: report
    needs: [heavy, camtoggle, platforms, windows-gst, degraded, installers]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Nightly failed $(date -u +%F)" \
            --body "The nightly workflow failed: $RUN"
