# Minimal coturn configuration for LOCAL DEVELOPMENT ONLY. Not for production: the shared
# secret below is public. Production credentials are short-lived and minted by the rendezvous.
listening-port=3478
realm=castcorder.local
fingerprint

# Time-limited credentials (TURN REST API), as the rendezvous will mint them.
use-auth-secret
static-auth-secret=castcorder-dev-secret

min-port=49160
max-port=49200

no-tls
no-dtls
no-cli
log-file=stdout
simple-log

# Relay metering: coturn's Prometheus exporter (port 9641, reached by the rendezvous's
# --turn-metrics on the compose network; not published) with bytes per username. Every
# credential is "<expiry>:<host id>", so the rendezvous sums them per host key. coturn adds
# a session's bytes when the session ends.
prometheus
prometheus-username-labels

# Caps. coturn counts user-quota per username and each minted credential has its own, so
# this caps allocations per credential, not per host key.
user-quota=8
# Bytes per second per session (about 20 Mbit/s).
max-bps=2500000
