[package]
name = "castcorder-transport"
description = "The host side of the star topology: str0m WebRTC forwarding driven through the clock and net ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["aws-lc-rs"]
# DTLS/SRTP crypto backend, forwarded to str0m. Exactly one; never openssl.
aws-lc-rs = ["str0m/aws-lc-rs"]
rust-crypto = ["str0m/rust-crypto"]

[dependencies]
castcorder-port-clock.workspace = true
castcorder-port-net.workspace = true
castcorder-link.workspace = true
castcorder-protocol.workspace = true
str0m.workspace = true
turn-client-proto.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
castcorder-core.workspace = true
castcorder-port-disk.workspace = true
tiny_http = "0.12"
turn-server-proto.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
