[package]
name = "castcorder-rendezvous"
description = "Castcorder rendezvous: a small WebSocket mailbox for connection info"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-or-later"
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
  "ws",
] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
castcorder-link.workspace = true
getrandom = "0.3"
hmac = "0.13"
sha1 = { version = "0.11", default-features = false }
tokio = { version = "1", features = [
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# The minting test talks to the real server over a real WebSocket, as a host does.
tungstenite = { version = "0.29", default-features = false, features = [
  "handshake",
] }
