# cargo-about (task app:licenses): the licences of every crate the desktop app
# links, gathered into licenses/third-party/rust-crates.html for the installers.
# A crate under a licence not listed here fails the task: check it can be
# redistributed with the app (MIT OR Apache-2.0) before adding it.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
  # File-level copyleft, used unmodified (Tauri's CSS parsing: cssparser,
  # selectors, dtoa-short; option-ext). Their source is on crates.io.
  "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
