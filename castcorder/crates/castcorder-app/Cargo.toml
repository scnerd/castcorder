[package]
name = "castcorder-app"
description = "Castcorder desktop app shell for hosts and app guests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# The library (host control, call link mapping) is plain Rust and runs in
# `task check`. The Tauri shell is the `desktop` feature: it needs the system
# webview (webkit2gtk on Linux), so `task app` and the CI app job build it.
[[bin]]
name = "castcorder-app"
path = "src/main.rs"
required-features = ["desktop"]

[features]
desktop = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-autostart",
  "dep:tauri-plugin-clipboard-manager",
  "dep:tauri-plugin-deep-link",
  "dep:tauri-plugin-single-instance",
  # generate_context! expands to serde_json paths.
  "dep:serde_json",
]
# The host participant's microphone through GStreamer (`--participate`, and
# joining and leaving from the window at runtime).
native-capture = ["castcorder-host/native-capture"]
# Register with the project's public rendezvous by default (release builds;
# see castcorder-host's feature of the same name).
project-rendezvous = ["castcorder-host/project-rendezvous"]
# The live transcript with whisper.cpp and the models bundled beside the app
# (cast-7hm.4; task app:models fetches them for the installers), on the CPU...
transcribe = ["castcorder-host/whisper"]
# ... or on the GPU: Vulkan (Windows, Linux) or Metal (macOS).
vulkan = ["transcribe", "castcorder-host/whisper-vulkan"]
metal = ["transcribe", "castcorder-host/whisper-metal"]

[dependencies]
castcorder-host = { path = "../castcorder-host" }
castcorder-link.workspace = true
tracing.workspace = true
serde_json = { workspace = true, optional = true }
tauri = { version = "2", optional = true, features = ["tray-icon"] }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
# Windows and Linux deliver a deep link by starting a second process; this
# hands it to the running app instead of starting a second host.
tauri-plugin-single-instance = { version = "2", optional = true, features = [
  "deep-link",
] }

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dev-dependencies]
castcorder-core.workspace = true
castcorder-port-capture.workspace = true
castcorder-port-disk.workspace = true
castcorder-protocol.workspace = true
castcorder-transfer.workspace = true
castcorder-port-clock.workspace = true
castcorder-port-net.workspace = true
castcorder-transport.workspace = true
# The transcript test speaks the simulation's tone code as Opus.
castcorder-port-transcribe.workspace = true
opus = "0.4"
# The presence test reaches contacts through the real Rust rendezvous.
castcorder-rendezvous = { path = "../castcorder-rendezvous" }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json.workspace = true
str0m.workspace = true
