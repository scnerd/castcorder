<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Castcorder</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 3rem; color: #222; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Castcorder</h1>
    <p id="what">The host is starting.</p>
    <pre id="error"></pre>
    <script>
      // The shell shows this page only when the host could not start; it
      // passes the reason as ?error=...
      const error = new URLSearchParams(location.search).get("error");
      if (error) {
        document.getElementById("what").textContent = "The host could not start:";
        document.getElementById("error").textContent = error;
      }
    </script>
  </body>
</html>
