[package]
name = "castcorder-transcribe"
description = "Local speech to text for the host: whisper.cpp (whisper-rs) behind the transcription port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# GPU through Vulkan (release builds): about 40 MB, no extra DLLs. Without it,
# or with no usable GPU at runtime, whisper.cpp runs on the CPU.
vulkan = ["whisper-rs/vulkan"]

[dependencies]
castcorder-port-transcribe.workspace = true
tracing.workspace = true
# tracing_backend: whisper.cpp logs to tracing, not stderr.
whisper-rs = { version = "0.16", default-features = false, features = [
  "tracing_backend",
] }

[dev-dependencies]
castcorder-port-capture.workspace = true
