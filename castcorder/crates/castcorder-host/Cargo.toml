[package]
name = "castcorder-host"
description = "The M1 headless host: serves the Browser Guest over HTTPS on the LAN, forwards the call, and collects tracks and logs into the library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
castcorder-core.workspace = true
castcorder-port-clock.workspace = true
castcorder-port-disk.workspace = true
castcorder-port-net.workspace = true
castcorder-protocol.workspace = true
castcorder-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Self-signed certificate for the LAN page (browsers grant the microphone only in
# a secure context). aws-lc-rs is already the crypto backend via str0m; never ring.
rcgen = { version = "0.14", default-features = false, features = [
  "aws_lc_rs",
  "pem",
] }
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
  "std",
  "tls12",
] }
