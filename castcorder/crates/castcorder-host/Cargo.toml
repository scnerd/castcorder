[package]
name = "castcorder-host"
description = "The M1 headless host: serves the Browser Guest over HTTPS on the LAN, forwards the call, and collects tracks and logs into the library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
castcorder-align.workspace = true
castcorder-core.workspace = true
castcorder-link.workspace = true
castcorder-port-clock.workspace = true
castcorder-port-disk.workspace = true
castcorder-port-net.workspace = true
castcorder-protocol.workspace = true
castcorder-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
# Salted password hashes in room.json (already in the tree via castcorder-link).
sha2 = { version = "0.11", default-features = false }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The rendezvous connection: a blocking WebSocket on its own thread; TLS for
# wss:// is rustls (below) with the Mozilla roots, not tungstenite's TLS features.
getrandom = "0.3"
tungstenite = { version = "0.29", default-features = false, features = [
  "handshake",
] }
webpki-roots = "1"
# Self-signed certificate for the LAN page (browsers grant the microphone only in
# a secure context). aws-lc-rs is already the crypto backend via str0m; never ring.
rcgen = { version = "0.14", default-features = false, features = [
  "aws_lc_rs",
  "pem",
] }
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
  "std",
  "tls12",
] }
# Native capture for the host's own participant (--participate): GStreamer, so
# off by default; `task check` builds without it, `task host` turns it on.
castcorder-capture-gst = { workspace = true, optional = true }
castcorder-port-capture = { workspace = true, optional = true }
castcorder-recorder = { workspace = true, optional = true }

[features]
native-capture = [
  "dep:castcorder-capture-gst",
  "dep:castcorder-port-capture",
  "dep:castcorder-recorder",
]
