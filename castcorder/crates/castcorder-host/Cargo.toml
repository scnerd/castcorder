[package]
name = "castcorder-host"
description = "The M1 headless host: serves the Browser Guest over HTTPS on the LAN, forwards the call, and collects tracks and logs into the library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
castcorder-align.workspace = true
castcorder-core.workspace = true
castcorder-link.workspace = true
castcorder-port-clock.workspace = true
castcorder-port-disk.workspace = true
castcorder-port-net.workspace = true
castcorder-protocol.workspace = true
castcorder-port-transcribe.workspace = true
castcorder-transcribe = { path = "../castcorder-transcribe", optional = true }
# The live transcript decodes each participant's Opus (libopus, built from
# source when the system has none).
opus = "0.4"
castcorder-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
# Salted password hashes in room.json (already in the tree via castcorder-link).
sha2 = { version = "0.11", default-features = false }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The rendezvous connection: a blocking WebSocket on its own thread; TLS for
# wss:// is rustls (below) with the Mozilla roots, not tungstenite's TLS features.
getrandom = "0.4"
tungstenite = { version = "0.30", default-features = false, features = [
  "handshake",
] }
webpki-roots = "1"
# Self-signed certificate for the LAN page (browsers grant the microphone only in
# a secure context). aws-lc-rs is already the crypto backend via str0m; never ring.
rcgen = { version = "0.14", default-features = false, features = [
  "aws_lc_rs",
  "pem",
] }
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
  "std",
  "tls12",
] }
# Native capture for the host's own participant (--participate): GStreamer, so
# off by default; `task check` builds without it, `task host` turns it on.
castcorder-capture-gst = { workspace = true, optional = true }
castcorder-port-capture.workspace = true
castcorder-recorder.workspace = true
# Ctrl+C finalises an in-progress take (host microphone, safety tracks) before exit.
ctrlc = "3"

[features]
native-capture = ["dep:castcorder-capture-gst"]
# Register with the project's public rendezvous (PROJECT_RENDEZVOUS in
# src/lib.rs) unless --rendezvous says otherwise. The release builds use it;
# local and test builds leave it off.
project-rendezvous = []
# The live transcript with whisper.cpp (cast-7hm). Without it, --transcribe
# with a model reports that this build cannot transcribe.
whisper = ["dep:castcorder-transcribe"]
# The GPU for it: Vulkan (Windows, Linux release builds) or Metal (macOS).
whisper-vulkan = ["whisper", "castcorder-transcribe/vulkan"]
whisper-metal = ["whisper", "castcorder-transcribe/metal"]
