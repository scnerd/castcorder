[package]
name = "castcorder-worker"
description = "Castcorder's public rendezvous and client site as a Cloudflare Worker (ADR 0004)"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/scnerd/castcorder"
publish = false

# Its own workspace (excluded from castcorder/Cargo.toml): it only builds for
# wasm32-unknown-unknown and pins its own wasm-bindgen (workers-rs), apart from
# the client's (trunk). `task worker:build` / `task worker:dev` / `task worker:lint`.
[workspace]

[lib]
crate-type = ["cdylib"]

[lints.rust]
missing_docs = "warn"

[dependencies]
# The mailbox logic is shared with castcorder-rendezvous; this crate is only
# the Cloudflare glue around it.
castcorder-link = { path = "../crates/castcorder-link" }
castcorder-mailbox = { path = "../crates/castcorder-mailbox" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "std",
] }
# The worker macros expand to wasm_bindgen paths.
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Crypto"] }
worker = "0.9"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
