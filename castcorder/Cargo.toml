[workspace]
resolver = "3"
members = ["crates/*"]
# castcorder-capture-gst needs a GStreamer install, so plain `cargo build` skips it.
# Tasks that use --workspace must add `--exclude castcorder-capture-gst`; `task test:gst`
# builds it.
default-members = [
  "crates/castcorder-align",
  "crates/castcorder-app",
  "crates/castcorder-client",
  "crates/castcorder-core",
  "crates/castcorder-host",
  "crates/castcorder-link",
  "crates/castcorder-mailbox",
  "crates/castcorder-port-capture",
  "crates/castcorder-port-clock",
  "crates/castcorder-port-disk",
  "crates/castcorder-port-net",
  "crates/castcorder-port-transcribe",
  "crates/castcorder-protocol",
  "crates/castcorder-recorder",
  "crates/castcorder-rendezvous",
  "crates/castcorder-transfer",
  "crates/castcorder-transport",
]
# Spikes are throwaway experiments with their own manifests; keep them out of the workspace.
# The Cloudflare Worker (worker/) is its own workspace: wasm32 only, its own
# wasm-bindgen. `task worker:*` builds and lints it.
exclude = ["spikes", "worker"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scnerd/castcorder"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
castcorder-protocol = { path = "crates/castcorder-protocol" }
castcorder-core = { path = "crates/castcorder-core" }
castcorder-client = { path = "crates/castcorder-client" }
castcorder-port-clock = { path = "crates/castcorder-port-clock" }
castcorder-port-net = { path = "crates/castcorder-port-net" }
castcorder-port-disk = { path = "crates/castcorder-port-disk" }
castcorder-port-capture = { path = "crates/castcorder-port-capture" }
castcorder-port-transcribe = { path = "crates/castcorder-port-transcribe" }
castcorder-capture-gst = { path = "crates/castcorder-capture-gst" }
castcorder-recorder = { path = "crates/castcorder-recorder" }
castcorder-align = { path = "crates/castcorder-align" }
# Pure-Rust FLAC, as in the browser-recorder spike; keep behind castcorder-recorder.
flacenc = { version = "0.5.1", default-features = false }
claxon = "0.4"
# Pinned as in the transfer spike (spikes/transfer/FINDINGS.md); keep behind this crate.
bao-tree = { version = "0.17", default-features = false, features = [
  "validate",
] }
blake3 = { version = "1.8", default-features = false, features = ["std"] }
castcorder-transfer = { path = "crates/castcorder-transfer" }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
castcorder-transport = { path = "crates/castcorder-transport" }
castcorder-link = { path = "crates/castcorder-link" }
castcorder-mailbox = { path = "crates/castcorder-mailbox" }
# Pinned as in the SFU spike (spikes/sfu/FINDINGS.md): str0m is pre-1.0. Keep it
# behind castcorder-transport. Never enable its openssl backend.
str0m = { version = "=0.25.0", default-features = false }
# Sans-IO TURN (RFC 8656): the client for the host's relayed candidate, and the
# server half for the in-process relay in tests (cast-zxk). UDP allocations only.
turn-client-proto = "0.8"
turn-server-proto = "0.8"
tracing = "0.1"
serde_json = "1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "registry",
  "std",
] }

# Aligned-track rendering is a windowed-sinc per output sample: unoptimised it
# makes the synthetic tests slow.
[profile.dev.package.castcorder-align]
opt-level = 3

# FLAC encoding is per-sample arithmetic; unoptimised it makes the long-take
# tests (tens of minutes of audio) crawl.
[profile.dev.package.castcorder-recorder]
opt-level = 3

# whisper.cpp (built by cmake) follows the opt-level: a debug build makes the
# transcription contract tests take minutes.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
debug = false

[profile.dev.package.flacenc]
opt-level = 3

[profile.dev.package.claxon]
opt-level = 3
