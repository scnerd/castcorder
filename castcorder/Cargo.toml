[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes are throwaway experiments with their own manifests; keep them out of the workspace.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scnerd/castcorder"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
castcorder-protocol = { path = "crates/castcorder-protocol" }
castcorder-core = { path = "crates/castcorder-core" }
castcorder-client = { path = "crates/castcorder-client" }
castcorder-port-clock = { path = "crates/castcorder-port-clock" }
castcorder-port-net = { path = "crates/castcorder-port-net" }
castcorder-port-disk = { path = "crates/castcorder-port-disk" }
castcorder-port-capture = { path = "crates/castcorder-port-capture" }
castcorder-recorder = { path = "crates/castcorder-recorder" }
# Pure-Rust FLAC, as in the browser-recorder spike; keep behind castcorder-recorder.
flacenc = { version = "0.5.1", default-features = false }
claxon = "0.4"
# Pinned as in the transfer spike (spikes/transfer/FINDINGS.md); keep behind this crate.
bao-tree = { version = "0.17", default-features = false, features = [
  "validate",
] }
blake3 = { version = "1.8", default-features = false, features = ["std"] }
castcorder-transfer = { path = "crates/castcorder-transfer" }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
