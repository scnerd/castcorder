[workspace]

[package]
name = "sfspike"
version = "0.0.0"
edition = "2021"
publish = false

[features]
# "ssr" = host side: server fn bodies are compiled and registered.
# Without it (browser guest / UI) only the typed client stubs are compiled.
ssr = ["server_fn/ssr", "server_fn_macro_default/ssr", "dep:tokio"]

[dependencies]
server_fn = { version = "0.8.13", default-features = false, features = ["postcard"] }
server_fn_macro_default = "0.8"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
bytes = "1"
http = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "macros"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
