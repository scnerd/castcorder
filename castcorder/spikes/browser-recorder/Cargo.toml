[package]
name = "browser-recorder"
version = "0.1.0"
edition = "2021"
publish = false
description = "Castcorder spike: raw microphone recording to OPFS from a Leptos CSR app"
license = "MIT"

# Empty workspace table: this spike never attaches to a parent workspace.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/main.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
flacenc = { version = "0.5.1", default-features = false }
web-sys = { version = "0.3", features = [
  "AnalyserNode", "AudioContext", "AudioContextOptions", "AudioDestinationNode", "AudioNode",
  "AudioParam", "AudioWorklet", "AudioWorkletNode", "AudioWorkletNodeOptions", "BaseAudioContext",
  "ChannelCountMode", "ChannelInterpretation", "GainNode", "MediaStreamAudioSourceNode",
  "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack",
  "MediaTrackSettings", "MediaTrackConstraints", "MessageChannel", "MessagePort", "MessageEvent",
  "Navigator", "WorkerNavigator", "Window", "Worker", "WorkerOptions", "DedicatedWorkerGlobalScope",
  "StorageManager", "StorageEstimate", "FileSystemDirectoryHandle", "FileSystemFileHandle",
  "FileSystemGetFileOptions", "FileSystemSyncAccessHandle", "FileSystemReadWriteOptions",
  "FileSystemRemoveOptions", "File", "Blob", "Url", "HtmlAnchorElement", "Document", "Element",
  "HtmlElement", "Performance", "Location", "ConstantSourceNode", "AudioScheduledSourceNode",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies.claxon]
version = "0.4"
