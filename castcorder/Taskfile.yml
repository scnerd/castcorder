version: "3"

# The Rust workspace tasks. Included (flattened) by the root Taskfile.yml, so run
# them from the repo root: `task check`. Never touches castcorder/spikes/, which is
# excluded from the workspace.

tasks:
  fmt:
    desc: Format all Rust code
    cmds:
      - cargo fmt --all
      - cargo fmt --manifest-path worker/Cargo.toml

  fmt:check:
    desc: Check Rust formatting without rewriting files
    cmds:
      - cargo fmt --all --check
      - cargo fmt --manifest-path worker/Cargo.toml --check

  clippy:
    desc: Clippy on native (with tests) and wasm32 for the browser-facing crates, warnings denied
    cmds:
      - cargo clippy --workspace --exclude castcorder-capture-gst --all-targets --locked -- -D warnings
      # The Tauri shell (castcorder-app --features desktop) needs the system webview: `task app:check`.
      - cargo clippy -p castcorder-protocol -p castcorder-core -p castcorder-transfer -p castcorder-link -p castcorder-mailbox --lib --target wasm32-unknown-unknown --locked -- -D warnings
      # The Cloudflare Worker: its own workspace, wasm32 only.
      - task: worker:clippy
      # The Browser Guest: its UI and worker binaries only exist on wasm32.
      - cargo clippy -p castcorder-client --lib --bins --target wasm32-unknown-unknown --locked -- -D warnings

  lint:
    desc: Formatting and clippy (what the CI check job runs)
    cmds:
      - task: fmt:check
      - task: clippy

  test:unit:
    desc: Tiers 1-2 - unit, simulation, and doc tests (no Docker)
    cmds:
      - cargo test --workspace --exclude castcorder-capture-gst --locked

  worker:clippy:
    desc: Clippy on the Cloudflare Worker (castcorder/worker, its own workspace) for wasm32, warnings denied
    cmds:
      - cargo clippy --manifest-path worker/Cargo.toml --target wasm32-unknown-unknown --locked -- -D warnings

  worker:lock:
    desc: Refresh castcorder/worker/Cargo.lock after a castcorder-link or castcorder-mailbox dependency change
    summary: |
      The Worker is its own cargo workspace that path-depends on castcorder-link and
      castcorder-mailbox, so its lockfile goes stale when their dependencies change
      and `task worker:clippy --locked` fails. `cargo update --workspace` re-resolves
      without bumping anything else. The pre-commit hook worker-lock runs
      scripts/check_worker_lock.py and points here.
    cmds:
      - cargo update --workspace --manifest-path worker/Cargo.toml

  worker:tools:
    desc: Install the Worker's build tools inside the tree (worker-build in worker/.tools, wrangler in worker/node_modules)
    dir: worker
    cmds:
      - cargo install worker-build --version {{.WORKER_BUILD_VERSION}} --locked --root .tools
      - npm install --no-audit --no-fund
    vars:
      WORKER_BUILD_VERSION: 0.9.0
    status:
      - test -f .tools/bin/worker-build{{exeExt}}
      - test -f node_modules/wrangler/bin/wrangler.js

  worker:build:
    desc: Build the Cloudflare Worker (worker-build --release into worker/build)
    dir: worker
    deps: [worker:tools]
    cmds:
      - ./.tools/bin/worker-build{{exeExt}} --release

  worker:assets:
    desc: Build the client (trunk) and stage it as the Worker's static assets at worker/assets/v/<version>/
    summary: |
      Other build dirs: task worker:assets CLIENT_DIST=dist-agent
    vars:
      CLIENT_DIST: '{{.CLIENT_DIST | default "dist"}}'
      # The workspace version, which hosts pin in their call links (ADR 0002). jq, not uv:
      # deploy.yml's build job has no uv.
      WORKSPACE_VERSION:
        sh: jq -rRn '[inputs | capture("^version = \"(?<v>[0-9]+[.][0-9]+[.][0-9]+)\"")? | .v] | first // empty' Cargo.toml
      CLIENT_VERSION: "{{.CLIENT_VERSION | default .WORKSPACE_VERSION}}"
    cmds:
      - cd crates/castcorder-client && trunk build --release --dist {{.CLIENT_DIST}}
      - node worker/stage-assets.mjs crates/castcorder-client/{{.CLIENT_DIST}} {{.CLIENT_VERSION}}

  worker:dev:
    desc: Run the Worker locally under wrangler dev (client at /v/<workspace version>/, rendezvous at /ws; no Cloudflare account needed)
    summary: |
      Builds the client and the Worker, then `wrangler dev` on 127.0.0.1:8787
      (extra wrangler arguments after --). Point a host at it with
      `castcorder-host --rendezvous http://127.0.0.1:8787`.
      Other build dirs: task worker:dev CLIENT_DIST=dist-agent
    cmds:
      - task: worker:assets
        vars: { CLIENT_DIST: "{{.CLIENT_DIST}}" }
      - task: worker:build
      - cd worker && node node_modules/wrangler/bin/wrangler.js dev --ip 127.0.0.1 {{.CLI_ARGS}}

  check:
    desc: Formatting, clippy, and tiers 1-2 tests; no Docker needed
    cmds:
      - task: lint
      - task: test:unit

  test:gst:
    desc: castcorder-capture-gst against a real GStreamer (needs the GStreamer runtime and development files, and pkg-config)
    summary: |
      Not part of `task check`: CI and other machines may lack GStreamer. On Windows
      install the MSVC runtime and development packages; the installer sets
      GSTREAMER_1_0_ROOT_MSVC_X86_64, PKG_CONFIG_PATH (its lib\pkgconfig) and Path
      (its bin, which holds pkg-config.exe) -- open a new shell afterwards.
      The microphone test skips itself when there is no input device.
    cmds:
      - cargo clippy -p castcorder-capture-gst --all-targets -- -D warnings
      - cargo test -p castcorder-capture-gst -- --nocapture
      # The host with native capture (--participate): the real microphone through
      # the full path into a library take; skips without an input device.
      - cargo clippy -p castcorder-host --features native-capture --all-targets -- -D warnings
      - cargo test -p castcorder-host --features native-capture -- --nocapture
      # The app's host control joins and leaves natively at runtime: a WAV file
      # through the capture port into two takes, bit-exact.
      - cargo clippy -p castcorder-app --features native-capture --all-targets -- -D warnings
      - cargo test -p castcorder-app --features native-capture -- --nocapture

  test:browser:transport:
    desc: castcorder-transport against 3 headless Chromium guests (installs Playwright and Chromium locally on first run)
    summary: |
      Builds the browser_host example (real UDP socket, system clock), then runs
      crates/castcorder-transport/browser-test/e2e.mjs with Playwright installed in
      that directory's node_modules (PLAYWRIGHT_BROWSERS_PATH=0), never globally.
      Run from the repo root: task test:browser
    dir: crates/castcorder-transport/browser-test
    cmds:
      - cargo build --release --locked -p castcorder-transport --example browser_host
      - npm install --no-audit --no-fund
      - node setup.mjs
      - node e2e.mjs

  test:browser:client:
    desc: The Browser Guest (castcorder-client) against castcorder-host with 2 headless Chromium guests (installs Playwright and Chromium locally on first run)
    summary: |
      Builds castcorder-host and the client with trunk (dist/), then runs
      crates/castcorder-client/browser-test/e2e.mjs with Playwright installed in
      that directory's node_modules (PLAYWRIGHT_BROWSERS_PATH=0), never globally.
      The host (bound to loopback) serves dist/ over localhost HTTP to guest A, the
      producer, and over HTTPS to guest B; A is fed a deterministic WAV, both join,
      B must receive A's audio, each must decode the other's simulcast video
      (camera off and on again without renegotiating), and A's take must come
      back out of OPFS bit-exact. Take 3 records video: the producer turns
      it on, webcams are recorded as WebM and sync after the audio (checked
      with ffprobe when installed; CI installs it).
      Then the recording fallbacks: `fallback` (Chromium with
      MediaStreamTrackProcessor deleted from window) and `firefox` (two headless
      Firefox guests, AudioWorklet capture; the host binds 0.0.0.0 and advertises
      the LAN address, as `task host` does, and the run is skipped without one).
      Run from the repo root with: task test:browser
    dir: crates/castcorder-client/browser-test
    cmds:
      - cargo build --release --locked -p castcorder-host -p castcorder-rendezvous
      - cd .. && trunk build --release
      - npm install --no-audit --no-fund
      - node setup.mjs
      - node e2e.mjs
      - node e2e.mjs fallback
      - node e2e.mjs firefox

  test:browser:camtoggle:
    desc: Stress the raw audio against camera toggles and a storage-worker stall in headless Chromium (not part of test:browser)
    summary: |
      Builds castcorder-host and the client like test:browser:client, then runs
      crates/castcorder-client/browser-test/camtoggle.mjs: one guest records
      takes with video, its storage worker is stalled for 500 ms and its camera
      turned off and on several times per take; every take's raw audio must
      arrive bit-exact with no discontinuity in its timing metadata (cast-47x).
      Arguments after --: takes, toggles, stall ms (default 3 4 500).
    dir: crates/castcorder-client/browser-test
    cmds:
      - cargo build --release --locked -p castcorder-host
      - cd .. && trunk build --release
      - npm install --no-audit --no-fund
      - node setup.mjs
      - node camtoggle.mjs {{.CLI_ARGS}}

  host:
    desc: Run a call on this machine's local network (builds the client and the host, then runs castcorder-host)
    summary: |
      Builds the Browser Guest with trunk (release) and runs castcorder-host,
      which prints the join links and the library path. Open the localhost link
      on this machine for the producer controls; guests on the same network open
      the https link. Stop with Ctrl+C. Pass host flags after --, e.g.
      task host -- --room my-show --library D:\Podcasts
      Files land in %USERPROFILE%\Castcorder\<room>\<call>\ by default.
      Built with the native-capture feature (needs GStreamer, as test:gst):
      add --participate [DEVICE] --name NAME to take part from this machine
      without a browser (see README).
    cmds:
      - cd crates/castcorder-client && trunk build --release
      - cargo run --release --locked -p castcorder-host --features native-capture -- --dist crates/castcorder-client/dist {{.CLI_ARGS}}

  app:
    desc: Run the desktop app (Tauri) on this machine - the host in-process, its producer page in the window, closes to the tray
    summary: |
      Builds the Browser Guest with trunk (release) and runs castcorder-app,
      which starts the host in its own process (same flags as castcorder-host,
      pass them after --) and shows the producer page; join the call from the
      window. Closing the window keeps hosting from the tray; Quit in the tray
      menu finishes the take and stops. Start at login is a tray toggle, off by
      default. The app registers castcorder:// links for this executable unless
      given --no-register. Built with native-capture (needs GStreamer, as
      test:gst), so --participate works as in `task host`.
      Linux needs the Tauri prerequisites (webkit2gtk-4.1, libsoup-3,
      libayatana-appindicator, librsvg). Other build dirs:
      CARGO_TARGET_DIR=... task app CLIENT_DIST=dist-agent
    vars:
      CLIENT_DIST: '{{.CLIENT_DIST | default "dist"}}'
    env:
      CASTCORDER_DIST: "{{.ROOT_DIR}}/castcorder/crates/castcorder-client/{{.CLIENT_DIST}}"
    cmds:
      - cd crates/castcorder-client && trunk build --release --dist {{.CLIENT_DIST}}
      - cargo run --release --locked -p castcorder-app --features desktop,native-capture -- {{.CLI_ARGS}}

  app:bundle:
    desc: Build the desktop app's installers (unsigned) with the client bundled - NSIS on Windows, .app and .dmg on macOS, .deb and AppImage on Linux
    summary: |
      Builds the Browser Guest with trunk into crates/castcorder-app/client, which
      tauri.bundle.conf.json ships as the app's `client` resource (the in-process
      host serves it from beside the executable or the platform's resource
      directory), then runs `cargo tauri build` (tauri-cli 2: `cargo binstall
      tauri-cli --version "^2"`). Installers land in
      <target dir>/release/bundle/ (<target dir>/<target>/release/bundle/ with
      --target). By default built without native-capture (the webview
      microphone only). With native capture on Windows, stage the trimmed
      GStreamer first and add its config (what release.yml does):
      task app:gst:stage
      task app:bundle FEATURES=desktop,native-capture EXTRA_CONFIG="--config tauri.gst.conf.json"
      On macOS the same with EXTRA_CONFIG="--config tauri.gst-macos.conf.json"
      (release.yml adds -- --target universal-apple-darwin, with
      PKG_CONFIG_ALLOW_CROSS=1). On Linux add EXTRA_CONFIG="--config
      tauri.gst-deb.conf.json" instead: the .deb depends on the distro's
      GStreamer (1.24 or newer). Pass bundles after --, e.g.
      task app:bundle -- --bundles nsis
    vars:
      FEATURES: '{{.FEATURES | default "desktop"}}'
      EXTRA_CONFIG: '{{.EXTRA_CONFIG | default ""}}'
    cmds:
      - cd crates/castcorder-client && trunk build --release --dist ../castcorder-app/client
      - cd crates/castcorder-app && cargo tauri build --config tauri.bundle.conf.json {{.EXTRA_CONFIG}} --features {{.FEATURES}} {{.CLI_ARGS}}

  app:models:
    desc: Fetch the transcription models the installers bundle into crates/castcorder-app/models (checked by size and SHA-256)
    summary: |
      ggml-small.en-q5_1 (GPU machines) and ggml-base.en-q8_0 (the CPU), from
      whisper.cpp's Hugging Face repository; see scripts/fetch_models.py. Bundle
      them with EXTRA_CONFIG="--config tauri.models.conf.json" and a FEATURES
      list with transcribe, vulkan or metal (what release.yml does). The app
      never downloads anything at runtime.
    cmds:
      - uv run ../scripts/fetch_models.py

  app:licenses:
    desc: Gather the licences of every Rust crate the desktop app links into crates/castcorder-app/licenses/third-party/rust-crates.html (cargo-about)
    summary: |
      The installers ship crates/castcorder-app/licenses/third-party (this file
      plus the notices for whisper.cpp and ggml, libopus and the Whisper
      models). Fails on a crate whose licence about.toml does not accept.
      Needs cargo-about (cargo binstall cargo-about). Pass the build's FEATURES.
    vars:
      FEATURES: '{{.FEATURES | default "desktop,native-capture,project-rendezvous,vulkan"}}'
    cmds:
      - cd crates/castcorder-app && cargo about generate --locked --features {{.FEATURES}} --fail -o licenses/third-party/rust-crates.html about.hbs

  app:icons:
    desc: Render the app icons (crates/castcorder-app/icons) from their SVG sources in icons/src
    summary: |
      icon.svg is the full mark (48 px and up), icon-small.svg the small cut
      (16-32 px). Writes the PNGs and the multi-size icon.ico tauri.conf.json
      lists. See scripts/render_icons.py.
    cmds:
      - uv run ../scripts/render_icons.py

  app:gst:stage:
    desc: Stage the trimmed, LGPL-only GStreamer the Windows and macOS installers bundle (crates/castcorder-app/gstreamer)
    summary: |
      Copies the plugins native capture uses and the libraries they import with
      their licences; refuses GPL or patent-encumbered libraries. See
      scripts/gst_bundle.py. Windows: from the MSVC GStreamer install
      (GSTREAMER_1_0_ROOT_MSVC_X86_64, or GST_ROOT=...); the app loads the DLLs
      from beside its executable and scans the plugins in gstreamer-1.0 there
      (castcorder-capture-gst). macOS: from the universal GStreamer.framework
      (runtime and devel packages; GST_ROOT defaults to its Versions/1.0);
      tauri.gst-macos.conf.json puts the libraries in the .app's
      Contents/Frameworks (the executable's rpath) and the plugins in
      Contents/Frameworks/gstreamer-1.0.
    platforms: [windows, darwin]
    vars:
      GST_ROOT: '{{.GST_ROOT | default .GSTREAMER_1_0_ROOT_MSVC_X86_64 | default "/Library/Frameworks/GStreamer.framework/Versions/1.0"}}'
    cmds:
      - uv run ../scripts/gst_bundle.py '{{.GST_ROOT}}' crates/castcorder-app/gstreamer

  app:check:
    desc: Clippy, tests and a headless smoke run of the desktop app (needs the system webview; CI runs it under xvfb on Linux)
    summary: |
      Clippy with the Tauri shell (feature desktop), the app's tests, then
      `castcorder-app --smoke`: the host starts on OS-picked loopback ports in a
      throwaway library, the hidden window loads its producer page, the app
      prints APP_READY, stops the host and exits. Registers nothing with the OS.
    cmds:
      - cargo clippy -p castcorder-app --features desktop --all-targets --locked -- -D warnings
      - cargo test -p castcorder-app --features desktop --locked
      - cargo run -p castcorder-app --features desktop --locked -- --smoke
