# Local dev: the rendezvous and coturn. Build the client first (task host or
# `trunk build --release` in castcorder/crates/castcorder-client); it is served
# at http://localhost:8080/v/0.0.0/. Point a host at it with
#   castcorder-host --dist ... --rendezvous http://localhost:8080
services:
  rendezvous:
    build:
      context: ./castcorder
      dockerfile: rendezvous.Dockerfile
    command:
      - --listen
      - 0.0.0.0:8080
      - --stun
      - 0.0.0.0:3479
      - --client
      - 0.0.0=/srv/client/0.0.0
      # Guests' browsers are told stun:<this name>:3479.
      - --public-host
      - localhost
    environment:
      RUST_LOG: info
    volumes:
      - type: bind
        source: ./castcorder/crates/castcorder-client/${CLIENT_DIST:-dist}
        target: /srv/client/0.0.0
        read_only: true
    ports:
      - "8080:8080/tcp"
      - "3479:3479/udp"

  coturn:
    image: coturn/coturn:4.6
    # Host networking is the practical way to run a TURN server locally (large UDP relay range).
    # It only works on Linux Docker; on Docker Desktop publish the ports instead.
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
