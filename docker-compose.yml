# Local dev: the rendezvous and coturn. Build the client first (task host or
# `trunk build --release` in castcorder/crates/castcorder-client); it is served
# at http://localhost:8080/v/0.0.0/. Point a host at it with
#   castcorder-host --dist ... --rendezvous http://localhost:8080
services:
  rendezvous:
    build:
      context: ./castcorder
      dockerfile: rendezvous.Dockerfile
    command:
      - --listen
      - 0.0.0.0:8080
      - --stun
      - 0.0.0.0:3479
      - --client
      - 0.0.0=/srv/client/0.0.0
      # Guests' browsers are told stun:<this name>:3479.
      - --public-host
      - localhost
      # Relay (TURN) credentials for hosts and guests; the secret comes from the
      # environment below. They expire after --turn-ttl seconds; hosts renew them.
      - --turn
      - "turn:${TURN_HOST:-localhost}:3478?transport=udp"
      # Relay metering: bytes relayed per host key, scraped from coturn's
      # Prometheus exporter and kept in the volume below. A host key over the
      # budget (per 30 days) gets no relay credentials (relay_quota). View it:
      #   docker compose exec rendezvous castcorder-rendezvous usage --data-dir /var/lib/castcorder
      - --turn-metrics
      - http://coturn:9641/metrics
      - --data-dir
      - /var/lib/castcorder
      - --relay-budget
      - ${CASTCORDER_RELAY_BUDGET:-50G}
    environment:
      RUST_LOG: info
      CASTCORDER_TURN_SECRET: ${CASTCORDER_TURN_SECRET:-castcorder-dev-secret}
    volumes:
      - type: bind
        source: ./castcorder/crates/castcorder-client/${CLIENT_DIST:-dist}
        target: /srv/client/0.0.0
        read_only: true
      - type: volume
        source: rendezvous-data
        target: /var/lib/castcorder
    ports:
      - "8080:8080/tcp"
      - "3479:3479/udp"

  coturn:
    image: coturn/coturn:4.6
    # Ports are published, not host networking, so this works on Docker Desktop too.
    # The relay range is the min-port/max-port in coturn/turnserver.conf; the
    # published relayed addresses are reached at TURN_EXTERNAL_IP (this machine).
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      # One secret for the rendezvous (CASTCORDER_TURN_SECRET) and coturn.
      - --static-auth-secret=${CASTCORDER_TURN_SECRET:-castcorder-dev-secret}
      # Relayed addresses are announced as this IP, not the container's.
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}

volumes:
  rendezvous-data:
