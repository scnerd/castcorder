# SOPS creation rules (deploy/README.md). deploy/secrets.sops.yaml holds the inputs
# OpenTofu needs (deploy/tofu): cloudflare_bootstrap_token and tofu_state_passphrase,
# encrypted to the maintainer's age key. To share it, add a recipient here and run
# `sops updatekeys deploy/secrets.sops.yaml`.
creation_rules:
  # "." matches either separator (sops sees the path as the OS spells it).
  - path_regex: 'deploy.secrets\.sops\.yaml$'
    age: age1k8uxfy9fa5flhxmzhnyvfndakj62sxffraqc67mvu94ajem4np5q87cwc0
