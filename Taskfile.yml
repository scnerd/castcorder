version: "3"

# Taskfile is the single entry point: humans, agents, and CI all call these
# tasks. Each service keeps its own taskfile and is included here.

includes:
  # flatten: the Rust workspace tasks (fmt, clippy, lint, check, ...) are available
  # from the repo root without a namespace.
  castcorder:
    taskfile: ./castcorder/Taskfile.yml
    dir: ./castcorder
    flatten: true

tasks:
  default:
    cmds:
      - task --list

  hooks:
    desc: Wire (or repair) the git hook chain so beads and pre-commit both run
    summary: |
      Points core.hooksPath at .githooks/, which chains beads' hooks and the
      pre-commit tool's hooks. Never run `pre-commit install` here -- it fails
      by design once core.hooksPath is set. Run this after `bd init`, after a
      beads upgrade, and in any new worktree.
    cmds:
      - uv run scripts/check_hooks_wired.py --repair

  hygiene:
    desc: Run every hygiene hook against the whole tree (what the CI hygiene job runs)
    cmds:
      # pre-commit-uv makes hook environments install via uv, never pip.
      - uvx --with pre-commit-uv pre-commit run --all-files

  # Releases (docs/release.md, ADR 0006). The version lives in castcorder/Cargo.toml
  # ([workspace.package]); scripts/release.py writes and checks every copy of it.

  release:prepare:
    desc: "Bump every copy of the version and move CHANGELOG.md's Unreleased entries under it: task release:prepare VERSION=X.Y.Z"
    requires:
      vars: [VERSION]
    cmds:
      - uv run scripts/release.py prepare {{.VERSION}}

  release:check:
    desc: Every copy of the workspace version agrees and CHANGELOG.md is well formed (TAG=vX.Y.Z also checks the tag and the changelog entry)
    cmds:
      - uv run scripts/release.py check {{if .TAG}}--tag {{.TAG}}{{end}}

  release:notes:
    desc: Print CHANGELOG.md's entry for the workspace version (VERSION=X.Y.Z for another), the release's notes
    vars:
      WORKSPACE_VERSION:
        sh: uv run --quiet scripts/release.py version
    cmds:
      - uv run scripts/release.py notes {{.VERSION | default .WORKSPACE_VERSION}}

  release:protocol:
    desc: The protocol's wire encodings (wire.golden) keep every line of the last release unless PROTOCOL_VERSION went up (BASE=<ref> to compare with another)
    cmds:
      - uv run scripts/release.py protocol {{if .BASE}}--base {{.BASE}}{{end}}

  protocol:golden:
    desc: Rewrite castcorder/crates/castcorder-protocol/wire.golden from the protocol test samples (after an intended wire change)
    dir: castcorder
    env:
      CASTCORDER_BLESS: "1"
    cmds:
      - cargo test --locked -p castcorder-protocol --lib wire_encodings_match_the_golden_file

  test:
    desc: Everything in check, plus the system and browser tiers
    summary: |
      Tiers 1-2 (unit, simulation) are in `task check`. Tier 3 (system: the real
      host and rendezvous binaries as local processes, a Chromium guest joining
      by call link; coturn joins it with the TURN task) and tier 4 (browser:
      Playwright with Chromium and Firefox against the host).
    cmds:
      - task: check
      - task: test:system
      - task: test:browser

  test:system:
    desc: Tier 3 system test - a browser guest joins by call link only, through castcorder-rendezvous (real processes, headless Chromium)
    summary: |
      Builds castcorder-host, castcorder-rendezvous and the client (trunk), then
      runs castcorder/crates/castcorder-client/browser-test/system.mjs: the
      rendezvous (mailbox, STUN, the client at /v/<version>/) and the host
      (--rendezvous) as local processes on OS-picked loopback ports, guest A on
      the host's localhost page (LAN mode, producer), guest B with only the
      call link the host printed, guest C with a wrong call secret. B must hear
      A and B's take must sync into the host library; C must be rejected.
      No Docker (local processes are simpler and reliable on Windows).
      Other build dirs: CARGO_TARGET_DIR=... task test:system CLIENT_DIST=dist-agent
    dir: castcorder/crates/castcorder-client/browser-test
    vars:
      CLIENT_DIST: '{{.CLIENT_DIST | default "dist"}}'
    env:
      CASTCORDER_DIST: "{{.ROOT_DIR}}/castcorder/crates/castcorder-client/{{.CLIENT_DIST}}"
    cmds:
      - cargo build --release --locked -p castcorder-host -p castcorder-rendezvous
      - cd .. && trunk build --release --dist {{.CLIENT_DIST}}
      - npm install --no-audit --no-fund
      - node setup.mjs
      - node system.mjs

  test:system:worker:
    desc: Tier 3 system test against the Cloudflare Worker under wrangler dev instead of castcorder-rendezvous (no Cloudflare account needed)
    summary: |
      As test:system, with CASTCORDER_RENDEZVOUS=worker: system.mjs stages the
      client build as the Worker's static assets (castcorder/worker/assets),
      runs `wrangler dev` on OS-picked loopback ports, and the host and guests
      reach the host key's Durable Object. The host stays idle for 50 s first,
      so its Durable Object hibernates and must restore the host's connection,
      and the host's own pings must keep it alive. Then, through the Worker:
      background sync over a sync-only connection, link requests (a browser
      profile and a second host install), and the rejoin scenario's status
      queries (lib/rejoin.mjs). With Docker it also starts
      coturn (as test:relay) and runs the Worker with RELAY=coturn and coturn
      as its STUN server: a --relay-only host and a guest with
      ?iceTransportPolicy=relay must connect through credentials the Worker
      minted, and that host must learn its server-reflexive address from the
      hello's ice_servers. That phase's Worker mints 30 s credentials
      (TURN_TTL): the guest must renew its own before they expire and keep
      its call. Without Docker that phase is skipped (it fails under
      CASTCORDER_CI).
      Other build dirs: CARGO_TARGET_DIR=... task test:system:worker CLIENT_DIST=dist-agent
    dir: castcorder/crates/castcorder-client/browser-test
    vars:
      CLIENT_DIST: '{{.CLIENT_DIST | default "dist"}}'
    env:
      CASTCORDER_DIST: "{{.ROOT_DIR}}/castcorder/crates/castcorder-client/{{.CLIENT_DIST}}"
      CASTCORDER_RENDEZVOUS: worker
    cmds:
      - task: worker:build
      - cargo build --release --locked -p castcorder-host
      - cd .. && trunk build --release --dist {{.CLIENT_DIST}}
      - npm install --no-audit --no-fund
      - node setup.mjs
      - node system.mjs

  test:worker:relay:
    desc: The Worker's relay credentials under wrangler dev - coturn REST credentials, the per-host-key daily cap across a restart, and Cloudflare Realtime TURN when CF_TURN_KEY_ID/CF_TURN_API_TOKEN are set (no browser, no Docker)
    summary: |
      Runs castcorder/crates/castcorder-client/browser-test/worker-relay.mjs: a
      real castcorder-host and raw WebSocket guests against `wrangler dev`.
      RELAY=coturn with RELAY_DAILY_CAP=3: three credentials minted and checked
      (the host's and two guests'), the fourth refused with relay_quota, and
      still refused after wrangler restarts on the same state (the count is in
      Durable Object storage). Relay metering against a local stand-in for
      Cloudflare's TURN and analytics APIs (RELAY_BUDGET_BYTES=1000). With
      CF_TURN_KEY_ID and CF_TURN_API_TOKEN set
      (a Cloudflare Realtime TURN key), RELAY=cloudflare for real: the host
      must allocate on turn.cloudflare.com and a guest hello must carry the
      TURN URLs including TLS on 443. Without them that part prints SKIP, the
      one skip CASTCORDER_CI allows (CI has the TURN key only if it is also a repository secret, deploy/README.md).
      Other build dirs: CARGO_TARGET_DIR=... task test:worker:relay
    dir: castcorder/crates/castcorder-client/browser-test
    cmds:
      - task: worker:build
      - cargo build --release --locked -p castcorder-host
      - node worker-relay.mjs

  test:relay:
    desc: Forced-relay system test - a relay-only host and two relay-only Chromium guests hold a call through coturn (needs Docker)
    summary: |
      Builds castcorder-host, castcorder-rendezvous and the client (trunk), then
      runs castcorder/crates/castcorder-client/browser-test/relay.mjs: coturn
      (coturn/coturn:4.6 in Docker, use-auth-secret with a random per-run
      secret, only its UDP listening port published on a Docker-picked port),
      the rendezvous minting TURN credentials for it (--turn), the host with
      --relay-only, and two guests joining by call link with
      ?iceTransportPolicy=relay. Audio must flow and a take must sync.
      Docker Desktop is reached on 127.0.0.1; a Docker Engine inside WSL2 on the
      WSL VM's address (CASTCORDER_TURN_HOST overrides). Honours DOCKER_HOST.
      Not part of `task test` or `task check`.
      Other build dirs: CARGO_TARGET_DIR=... task test:relay CLIENT_DIST=dist-agent
    dir: castcorder/crates/castcorder-client/browser-test
    vars:
      CLIENT_DIST: '{{.CLIENT_DIST | default "dist"}}'
    env:
      CASTCORDER_DIST: "{{.ROOT_DIR}}/castcorder/crates/castcorder-client/{{.CLIENT_DIST}}"
    cmds:
      - cargo build --release --locked -p castcorder-host -p castcorder-rendezvous
      - cd .. && trunk build --release --dist {{.CLIENT_DIST}}
      - npm install --no-audit --no-fund
      - node setup.mjs
      - node relay.mjs

  test:relay:tcp:
    desc: Forced-relay system test over TCP only - the host (through its TURN stream bridge) and two Chromium guests reach coturn over TCP, none over UDP (needs Docker)
    summary: |
      The same run as test:relay (relay.mjs) with RELAY_TRANSPORT=tcp: the
      rendezvous hands out only coturn's `turn:HOST:PORT?transport=tcp` URL, so
      every TURN client, the host's through the loopback bridge in
      castcorder-host (turn_stream), speaks TCP to coturn and the allocations
      are still UDP relayed addresses. Not part of `task test` or `task check`.
    dir: castcorder/crates/castcorder-client/browser-test
    vars:
      CLIENT_DIST: '{{.CLIENT_DIST | default "dist"}}'
    env:
      CASTCORDER_DIST: "{{.ROOT_DIR}}/castcorder/crates/castcorder-client/{{.CLIENT_DIST}}"
      RELAY_TRANSPORT: tcp
    cmds:
      - cargo build --release --locked -p castcorder-host -p castcorder-rendezvous
      - cd .. && trunk build --release --dist {{.CLIENT_DIST}}
      - npm install --no-audit --no-fund
      - node setup.mjs
      - node relay.mjs

  test:browser:
    desc: Tier 4 browser tests (Playwright with headless Chromium and Firefox, installed locally on first run; no Docker)
    cmds:
      - task: test:browser:transport
      - task: test:browser:client

  dev:up:
    desc: Start the local dev services (rendezvous on 8080/tcp + 3479/udp serving the client build, and coturn)
    cmds:
      - docker compose up -d

  dev:down:
    desc: Stop the local dev services
    cmds:
      - docker compose down

  # Deploy setup (deploy/README.md, ADR 0004). OpenTofu in deploy/tofu owns the Cloudflare
  # deploy token, the Realtime TURN key and the GitHub production environment and its
  # secrets; wrangler in .github/workflows/deploy.yml deploys the Worker. Inputs come from
  # deploy/secrets.sops.yaml through `sops exec-env`, so they exist only in the
  # environment of the processes that need them, never on disk or in the log.

  deploy:secrets:edit:
    desc: Create or edit deploy/secrets.sops.yaml (cloudflare_bootstrap_token, tofu_state_passphrase) in $EDITOR
    interactive: true
    cmds:
      - sops edit deploy/secrets.sops.yaml

  deploy:turn-key:
    desc: Create the Realtime TURN key and store cf_turn_key_id and cf_turn_api_token in deploy/secrets.sops.yaml (once; `task deploy:turn-key FORCE=1` replaces it)
    cmds:
      - sops exec-env {{.SECRETS}} "task deploy:turn-key:run SECRETS={{.SECRETS}} FORCE={{.FORCE}}"
    vars:
      SECRETS: '{{.SECRETS | default "deploy/secrets.sops.yaml"}}'
      FORCE: '{{.FORCE | default "0"}}'

  # Runs inside `sops exec-env` (no desc: not listed), in Task's own shell so it never
  # depends on which bash is on PATH. Cloudflare shows the key's API token only on
  # creation and the OpenTofu provider does not keep it, so it lives in SOPS. Secrets
  # travel on stdin, never in arguments or the log.
  deploy:turn-key:run:
    preconditions:
      - sh: '[ -n "$cloudflare_bootstrap_token" ]'
        msg: "Run through `task deploy:turn-key` (sops exec-env sets cloudflare_bootstrap_token)."
      - sh: '[ -z "${cf_turn_key_id:-}" ] || [ "{{.FORCE}}" = "1" ]'
        msg: "{{.SECRETS}} already holds cf_turn_key_id. `task deploy:turn-key FORCE=1` makes a new key (then delete the old one under Realtime > TURN Server)."
    vars:
      ACCOUNT:
        sh: jq -rRn '[inputs | capture("^[ ]*cloudflare_account_id[ ]*=[ ]*\"(?<id>[0-9a-f]{32})\"")? | .id] | first // empty' deploy/tofu/terraform.tfvars
    cmds:
      - |
        set -eu
        [ -n "{{.ACCOUNT}}" ] || { echo "No cloudflare_account_id in deploy/tofu/terraform.tfvars." >&2; exit 1; }
        response=$(printf 'Authorization: Bearer %s' "$cloudflare_bootstrap_token" | curl -sS -H @- -H "Content-Type: application/json" --data '{"name":"castcorder-production"}' "https://api.cloudflare.com/client/v4/accounts/{{.ACCOUNT}}/calls/turn_keys")
        turn_id=$(printf '%s' "$response" | jq -r '.result.uid // empty')
        turn_token=$(printf '%s' "$response" | jq -r '.result.secret // .result.key // empty')
        if [ -z "$turn_id" ] || [ -z "$turn_token" ]; then
          echo "Creating the TURN key failed:" >&2
          printf '%s' "$response" | jq -c '{success, errors, result: (.result | if type == "object" then del(.secret, .key) else . end)}' >&2
          exit 1
        fi
        printf '%s' "$response" | jq '.result.uid' | sops set --value-stdin {{.SECRETS}} '["cf_turn_key_id"]'
        printf '%s' "$response" | jq '.result.secret // .result.key' | sops set --value-stdin {{.SECRETS}} '["cf_turn_api_token"]'
        echo "Created TURN key $turn_id and stored it in {{.SECRETS}}. Next: task deploy:infra"

  deploy:infra:plan:
    desc: Show what `task deploy:infra` would change (Cloudflare token and TURN key, GitHub environment and secrets)
    interactive: true
    cmds:
      - sops exec-env {{.SECRETS}} "task deploy:infra:tofu -- plan"
    vars:
      SECRETS: '{{.SECRETS | default "deploy/secrets.sops.yaml"}}'

  deploy:infra:
    desc: Apply deploy/tofu after a plan you confirm; commit deploy/tofu/terraform.tfstate afterwards (it is encrypted)
    interactive: true
    cmds:
      - sops exec-env {{.SECRETS}} "task deploy:infra:tofu -- apply"
    vars:
      SECRETS: '{{.SECRETS | default "deploy/secrets.sops.yaml"}}'

  # Runs inside `sops exec-env` (no desc: not listed): maps the SOPS keys onto the names
  # tofu and the providers read. Task echoes commands before expanding variables, so no
  # value reaches the log. Any tofu subcommand: `-- plan`, `-- apply`, `-- state list`.
  deploy:infra:tofu:
    interactive: true
    preconditions:
      - sh: '[ -n "$tofu_state_passphrase" ] && [ -n "$cloudflare_bootstrap_token" ]'
        msg: "Run through `task deploy:infra` or `task deploy:infra:plan` (sops exec-env sets tofu_state_passphrase and cloudflare_bootstrap_token)."
    env:
      TF_IN_AUTOMATION: "1"
    cmds:
      - TF_VAR_state_passphrase="$tofu_state_passphrase" tofu -chdir=deploy/tofu init -input=false
      - >-
        TF_VAR_state_passphrase="$tofu_state_passphrase"
        TF_VAR_cf_turn_key_id="${cf_turn_key_id:-}"
        TF_VAR_cf_turn_api_token="${cf_turn_api_token:-}"
        CLOUDFLARE_API_TOKEN="$cloudflare_bootstrap_token"
        GITHUB_TOKEN="$(gh auth token)"
        tofu -chdir=deploy/tofu {{.CLI_ARGS}}

  deploy:infra:validate:
    desc: tofu fmt -check and validate on deploy/tofu (no secrets, no Cloudflare or GitHub calls; downloads the pinned providers)
    cmds:
      - tofu -chdir=deploy/tofu fmt -check -recursive
      - tofu -chdir=deploy/tofu init -backend=false -input=false -lockfile=readonly
      - tofu -chdir=deploy/tofu validate

  deploy:check:
    desc: Smoke-check the live Worker at PROJECT_RENDEZVOUS (deploy/smoke.mjs; versions after --, default the workspace version)
    vars:
      URL:
        sh: jq -rRn '[inputs | capture("const PROJECT_RENDEZVOUS.*\"(?<u>https?://[A-Za-z0-9.:-]+)\"")? | .u] | first // empty' castcorder/crates/castcorder-host/src/lib.rs
      VERSION:
        sh: jq -rRn '[inputs | capture("^version = \"(?<v>[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.]+)?)\"")? | .v] | first // empty' castcorder/Cargo.toml
    cmds:
      - node deploy/smoke.mjs {{.URL}} {{.CLI_ARGS | default .VERSION}}
