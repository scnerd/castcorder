<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#15181d;background:#f3f4f6}
a{color:#1d4ed8}a:hover{color:#1e3a8a}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid #cfd4dc;background:#fff;color:#15181d;font:600 14px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.btn.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.muted{color:#555c66}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.field input,.field select{height:44px;padding:0 12px;border:1px solid #cfd4dc;border-radius:10px;font:400 15px Inter,system-ui,sans-serif;background:#fff;color:#15181d}
.pick{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:1px solid #cfd4dc;border-radius:10px;background:#fff;font-size:13px;min-width:0}
.pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</helmet>
<div style="min-height: 800px; display: flex; flex-direction: column; background: #f3f4f6">
  <header style="display: flex; align-items: center; gap: 12px; padding: 16px 32px; background: #fff; border-bottom: 1px solid #dde1e7">
    <div style="width: 28px; height: 28px; border-radius: 7px; background: #1f2937; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></div>
    <span style="font-weight: 700">Castcorder</span>
    <span style="margin-left: auto"></span>
    <a href="#calls" style="font-size: 14px">Your calls</a>
    <button class="btn ghost" type="button" aria-label="Settings" style="width: 40px; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
  </header>

  <main style="flex: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 40px; padding: 40px 32px; max-width: 1120px; width: 100%; box-sizing: border-box; margin: 0 auto">
    <section aria-label="Preview" style="flex: 1 1 440px; max-width: 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
      <div style="position: relative; aspect-ratio: 16 / 10; border-radius: 16px; background: linear-gradient(160deg, #2b313c, #1a1e25); overflow: hidden; display: flex; align-items: center; justify-content: center">
        <div style="width: 120px; height: 120px; border-radius: 50%; background: #3a4150; color: #fff; font-size: 40px; font-weight: 700; display: flex; align-items: center; justify-content: center">G</div>
        <span style="position: absolute; left: 14px; bottom: 14px; padding: 4px 10px; border-radius: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; font-weight: 600">Camera preview</span>
        <div style="position: absolute; right: 14px; bottom: 14px; display: flex; gap: 8px">
          <button class="btn" type="button" aria-label="Turn camera off" style="width: 44px; padding: 0; background: rgba(255,255,255,.92); border: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"></rect><path d="M16 10l6-3v10l-6-3z"></path></svg></button>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #fff; border: 1px solid #dde1e7">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
        <div style="flex: 1; display: flex; gap: 3px; align-items: center; height: 20px" aria-hidden="true">
          <span style="flex: 1; height: 8px; border-radius: 2px; background: #16a34a"></span><span style="flex: 1; height: 12px; border-radius: 2px; background: #16a34a"></span><span style="flex: 1; height: 18px; border-radius: 2px; background: #16a34a"></span><span style="flex: 1; height: 14px; border-radius: 2px; background: #16a34a"></span><span style="flex: 1; height: 10px; border-radius: 2px; background: #16a34a"></span><span style="flex: 1; height: 6px; border-radius: 2px; background: #dde1e7"></span><span style="flex: 1; height: 6px; border-radius: 2px; background: #dde1e7"></span><span style="flex: 1; height: 6px; border-radius: 2px; background: #dde1e7"></span>
        </div>
        <span style="font-size: 13px; font-weight: 600; color: #166534">We hear you</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <label class="pick" aria-label="Microphone"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path></svg><span>Shure MV7</span></label>
        <label class="pick" aria-label="Camera"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"></rect><path d="M16 10l6-3v10l-6-3z"></path></svg><span>FaceTime HD</span></label>
        <label class="pick" aria-label="Speakers"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7"></path></svg><span>Headphones</span></label>
      </div>
    </section>

    <section aria-label="Join" style="flex: 1 1 340px; max-width: 400px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div class="muted" style="font-size: 14px">Sam Rivera invited you to</div>
        <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.01em">Weekly show</h1>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 14px">
          <span style="display: flex"><span style="width: 24px; height: 24px; border-radius: 50%; background: #3a4150; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #f3f4f6">SR</span><span style="width: 24px; height: 24px; margin-left: -8px; border-radius: 50%; background: #5b4a8a; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #f3f4f6">PS</span></span>
          Sam and Priya are in the call
        </div>
      </div>
      <label class="field">Your name<input type="text" value="Gary" aria-required="true"></label>
      <div style="padding: 14px 16px; border-radius: 12px; background: #fff; border: 1px solid #dde1e7; display: flex; gap: 12px; font-size: 13px; line-height: 1.5">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b424c" stroke-width="2" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01M11 12h1v5h1"></path></svg>
        <span><strong>This call is recorded.</strong> Your computer records your mic and camera at full quality and sends the files to Sam. Producers can see and switch your devices. <a href="#more">More</a></span>
      </div>
      <button class="btn primary" type="button" style="height: 52px; font-size: 16px">Join call</button>    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
